<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomped - Em Manutenção</title>
    <style>
        /* Zera as margens padrão do navegador para evitar bordas brancas */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Esconde qualquer barra de rolagem */
            background-color: #fdf5f6; /* Uma cor de fundo suave caso a imagem demore um pouco para carregar */
        }

        /* Configuração da imagem para cobrir 100% da tela */
        #tela-manutencao {
            /* IMPORTANTE: Coloque o nome correto do seu arquivo de imagem aqui embaixo */
            background-image: url('manutencao.png');
            
            /* Mantém a parte central da imagem sempre visível */
            background-position: center;
            
            /* Evita que a imagem crie um padrão de repetição lado a lado */
            background-repeat: no-repeat;
            
            /* O 'cover' faz a mágica de preencher tudo, adaptando as proporções sem amassar a foto */
            background-size: cover;
            
            /* Tamanhos iniciais usando as medidas da janela (viewport) */
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>
<body>

    <div id="tela-manutencao"></div>

    <script>
        // O JavaScript abaixo é um truque extra para garantir adaptação perfeita em dispositivos móveis.
        // Ele calcula a altura exata da tela visível e reajusta sempre que o tamanho da janela mudar 
        // (por exemplo, quando o usuário deitar o celular).

        function ajustarAltura() {
            const tela = document.getElementById('tela-manutencao');
            // Pega a altura interna exata do navegador e aplica na nossa div
            tela.style.height = window.innerHeight + 'px';
        }

        // Executa o ajuste assim que a página termina de carregar
        window.addEventListener('load', ajustarAltura);

        // Executa o ajuste toda vez que a tela for redimensionada
        window.addEventListener('resize', ajustarAltura);

        // Uma mensagem fofa no console só para desenvolvedores curiosos
        console.log("🛠️ O site Tomped está descansando um pouquinho e logo estará de volta!");
    </script>
</body>
</html>
